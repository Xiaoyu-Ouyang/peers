[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "peers"
description = "Mirror selected Claude Code sessions to collaborators through a git repo"
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["version"]
dependencies = []

[project.scripts]
peers = "peers:main"

[tool.setuptools]
py-modules = ["peers"]

[tool.setuptools.dynamic]
version = { attr = "peers.__version__" }
